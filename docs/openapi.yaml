{
  "openapi": "3.1.0",
  "info": {
    "title": "radiopipe API",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "https://example.test",
      "description": "Deployment-specific base URL"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/episodes": {
      "get": {
        "summary": "List completed episodes",
        "description": "Private read-only Episode index. Requires a Sanctum bearer token with the episodes:read ability. The response is lightweight and does not include scenario JSON, topics, internal snapshots, prompts, raw model responses, raw article bodies, or secrets.",
        "operationId": "listEpisodes",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "description": "Maximum number of episodes to return. Defaults to 100 and is clamped to 500.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 500,
              "default": 100
            }
          },
          {
            "name": "status",
            "in": "query",
            "description": "Episode status. The client API currently exposes completed episodes only.",
            "schema": {
              "type": "string",
              "enum": [
                "completed"
              ],
              "default": "completed"
            }
          },
          {
            "name": "character",
            "in": "query",
            "description": "Filter by character_key.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "from",
            "in": "query",
            "description": "Filter by published_at greater than or equal to this datetime.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "description": "Filter by published_at less than or equal to this datetime.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Episode index.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EpisodeIndexResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
    "/api/episodes/latest": {
      "get": {
        "summary": "Get latest completed episode",
        "description": "Private read-only latest completed Episode detail. Requires a Sanctum bearer token with the episodes:read ability.",
        "operationId": "getLatestEpisode",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Latest completed Episode detail.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EpisodeDetailResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/api/episodes/{episode_key}": {
      "get": {
        "summary": "Get completed episode by key",
        "description": "Private read-only Episode detail by episode_key. Requires a Sanctum bearer token with the episodes:read ability. Returns 404 when the Episode does not exist or is not visible to the client API.",
        "operationId": "getEpisodeByKey",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "episode_key",
            "in": "path",
            "required": true,
            "description": "Episode key.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Completed Episode detail.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EpisodeDetailResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/api/topics/{id}/rating": {
      "put": {
        "summary": "Set topic rating",
        "description": "Private write-through Topic Rating API. Requires a Sanctum bearer token with the topics:rate ability. The rating is forwarded to upstream digestpipe and no local rating history is stored.",
        "operationId": "setTopicRating",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Public radiopipe topic_id. URL-encode the path segment when needed.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TopicRatingRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated topic rating state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TopicRatingResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "502": {
            "$ref": "#/components/responses/BadGateway"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      },
      "delete": {
        "summary": "Clear topic rating",
        "description": "Private write-through Topic Rating API. Requires a Sanctum bearer token with the topics:rate ability. The clear request is forwarded to upstream digestpipe and no local rating history is stored.",
        "operationId": "clearTopicRating",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Public radiopipe topic_id. URL-encode the path segment when needed.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Cleared topic rating state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TopicRatingResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "502": {
            "$ref": "#/components/responses/BadGateway"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "responses": {
      "Unauthorized": {
        "description": "Unauthenticated.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Forbidden": {
        "description": "Authenticated token is missing the required ability.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "NotFound": {
        "description": "Episode not found.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ValidationError": {
        "description": "Invalid query parameters.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ValidationErrorResponse"
            }
          }
        }
      },
      "BadGateway": {
        "description": "Upstream service returned an unexpected failure.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ServiceUnavailable": {
        "description": "Upstream service is unavailable.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "EpisodeIndexResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "episodes",
          "meta"
        ],
        "properties": {
          "episodes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EpisodeIndexItem"
            }
          },
          "meta": {
            "$ref": "#/components/schemas/EpisodeIndexMeta"
          }
        }
      },
      "EpisodeIndexMeta": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "count",
          "limit"
        ],
        "properties": {
          "count": {
            "type": "integer",
            "minimum": 0
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 500
          }
        }
      },
      "EpisodeIndexItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "episode_key",
          "status",
          "published_at",
          "processed_at",
          "title",
          "character",
          "language"
        ],
        "properties": {
          "episode_key": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "completed"
            ]
          },
          "published_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "processed_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "title": {
            "type": [
              "string",
              "null"
            ]
          },
          "character": {
            "$ref": "#/components/schemas/EpisodeCharacter"
          },
          "language": {
            "type": "string"
          }
        }
      },
      "EpisodeDetailResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "episode"
        ],
        "properties": {
          "episode": {
            "$ref": "#/components/schemas/EpisodeDetail"
          }
        }
      },
      "EpisodeDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "episode_key",
          "status",
          "published_at",
          "processed_at",
          "title",
          "character",
          "language",
          "scenario_json",
          "topics"
        ],
        "properties": {
          "episode_key": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "completed"
            ]
          },
          "published_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "processed_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "title": {
            "type": [
              "string",
              "null"
            ]
          },
          "character": {
            "$ref": "#/components/schemas/EpisodeCharacter"
          },
          "language": {
            "type": "string"
          },
          "scenario_json": {
            "$ref": "#/components/schemas/EpisodeScenario"
          },
          "topics": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EpisodeTopic"
            }
          }
        }
      },
      "EpisodeCharacter": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "key",
          "name"
        ],
        "properties": {
          "key": {
            "type": [
              "string",
              "null"
            ]
          },
          "name": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "EpisodeScenario": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "language",
          "target_duration_seconds",
          "estimated_duration_seconds",
          "character_key",
          "script_text",
          "sections",
          "metadata"
        ],
        "properties": {
          "title": {
            "type": "string",
            "description": "Episode-specific generated title based on selected topics. It is not a fixed program title."
          },
          "language": {
            "type": "string"
          },
          "target_duration_seconds": {
            "type": "integer",
            "minimum": 0
          },
          "estimated_duration_seconds": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "character_key": {
            "type": [
              "string",
              "null"
            ]
          },
          "script_text": {
            "type": "string"
          },
          "sections": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EpisodeScenarioSection"
            }
          },
          "metadata": {
            "$ref": "#/components/schemas/FreeFormMetadata"
          }
        }
      },
      "EpisodeScenarioSection": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "text",
          "topic_ids",
          "estimated_duration_seconds",
          "metadata"
        ],
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "opening",
              "topic",
              "closing"
            ]
          },
          "title": {
            "type": "string"
          },
          "text": {
            "type": "string"
          },
          "topic_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "estimated_duration_seconds": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "metadata": {
            "$ref": "#/components/schemas/FreeFormMetadata"
          }
        }
      },
      "EpisodeTopic": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "topic_id",
          "status",
          "title",
          "summary",
          "why_it_matters",
          "source_name",
          "url",
          "discussion_url",
          "sort_order"
        ],
        "properties": {
          "topic_id": {
            "type": "string"
          },
          "status": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "used_in_scenario",
              "selected_not_used",
              null
            ]
          },
          "title": {
            "type": [
              "string",
              "null"
            ]
          },
          "summary": {
            "type": [
              "string",
              "null"
            ]
          },
          "why_it_matters": {
            "type": [
              "string",
              "null"
            ]
          },
          "source_name": {
            "type": [
              "string",
              "null"
            ]
          },
          "url": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri"
          },
          "discussion_url": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri"
          },
          "sort_order": {
            "type": "integer"
          }
        }
      },
      "FreeFormMetadata": {
        "type": [
          "object",
          "array"
        ],
        "description": "Free-form generation metadata. Empty PHP arrays may serialize as [] in existing stored scenario JSON.",
        "additionalProperties": true
      },
      "ErrorResponse": {
        "type": "object",
        "additionalProperties": true,
        "required": [
          "message"
        ],
        "properties": {
          "message": {
            "type": "string"
          }
        }
      },
      "ValidationErrorResponse": {
        "type": "object",
        "additionalProperties": true,
        "required": [
          "message",
          "errors"
        ],
        "properties": {
          "message": {
            "type": "string"
          },
          "errors": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "TopicRatingRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "rating"
        ],
        "properties": {
          "rating": {
            "type": "integer",
            "enum": [
              -1,
              1,
              2,
              3,
              4,
              5
            ]
          }
        }
      },
      "TopicRatingResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "topic_rating"
        ],
        "properties": {
          "topic_rating": {
            "$ref": "#/components/schemas/TopicRating"
          }
        }
      },
      "TopicRating": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "topic_id",
          "upstream",
          "rating",
          "rated_at"
        ],
        "properties": {
          "topic_id": {
            "type": "string"
          },
          "upstream": {
            "$ref": "#/components/schemas/TopicRatingUpstreamRef"
          },
          "rating": {
            "type": [
              "integer",
              "null"
            ],
            "enum": [
              -1,
              1,
              2,
              3,
              4,
              5,
              null
            ]
          },
          "rated_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "TopicRatingUpstreamRef": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "provider",
          "id"
        ],
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "digestpipe"
            ]
          },
          "id": {
            "type": "integer"
          }
        }
      }
    }
  }
}
